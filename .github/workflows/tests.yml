name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: End-to-end CLI smoke run (simulated data)
        run: |
          ivchar run --dies 4 --temps 25 125 --corners TT --out ci_output
          ivchar reliability --out ci_reliability
          test -s ci_output/report.html && test -s ci_reliability/reliability_report.html
